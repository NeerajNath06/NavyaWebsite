<header [class.scrolled]="isScrolled" class="header">
  <nav class="navbar">
    <div class="container">
      <div class="nav-wrapper">
        <!-- Logo -->
        <a routerLink="/" class="logo">
          <div class="logo-3d">
            <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
              <path d="M25 5L45 15V35L25 45L5 35V15L25 5Z" stroke="url(#gradient)" stroke-width="2" fill="none"/>
              <path d="M25 15L35 20V30L25 35L15 30V20L25 15Z" fill="url(#gradient)"/>
              <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#0057FF;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="logo-text">Navya Cloud</span>
        </a>

        <!-- Desktop Navigation -->
        <ul class="nav-menu" [class.mobile-open]="isMobileMenuOpen">
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a></li>
          <li><a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a></li>
          <li><a routerLink="/portfolio" routerLinkActive="active" (click)="closeMobileMenu()">Portfolio</a></li>
          <li><a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a></li>
          <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a></li>
          <li class="theme-toggle-item">
            <button class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
              <svg *ngIf="currentTheme === 'dark'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg *ngIf="currentTheme === 'light'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </li>
          <li class="cta-item">
            <a routerLink="/get-quote" class="btn-cta" (click)="closeMobileMenu()">Get a Quote</a>
          </li>
        </ul>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-toggle" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>
</header>
