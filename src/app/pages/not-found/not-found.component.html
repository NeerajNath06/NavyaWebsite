<div class="not-found-page">
  <section class="not-found-section section">
    <div class="container">
      <div class="not-found-content fade-in-up">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p class="error-message">Oops! The page you're looking for doesn't exist.</p>
        <p class="error-description">It might have been moved, deleted, or the URL might be incorrect.</p>
        <div class="error-actions">
          <a routerLink="/" class="btn btn-primary">Go to Homepage</a>
          <a routerLink="/contact" class="btn btn-secondary">Contact Us</a>
        </div>
      </div>
      
      <div class="floating-elements">
        <div class="float-element element-1"></div>
        <div class="float-element element-2"></div>
        <div class="float-element element-3"></div>
      </div>
    </div>
  </section>
</div>
