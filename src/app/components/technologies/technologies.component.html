<section class="technologies-section section">
  <div class="container">
    <div class="section-header fade-in-up">
      <h2>Technologies We Use</h2>
      <p class="section-subtitle">Cutting-edge tools for cutting-edge solutions</p>
    </div>
    
    <div class="technologies-grid">
      <div class="tech-card glass-card" *ngFor="let tech of technologies">
        <div class="tech-icon" [attr.data-category]="tech.category">
          <span [attr.class]="'icon-' + tech.icon">{{ getTechIcon(tech.icon) }}</span>
        </div>
        <h4>{{ tech.name }}</h4>
      </div>
    </div>
  </div>
</section>
